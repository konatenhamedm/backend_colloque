doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        # Clean architecture : chaque module porte ses entités dans <Module>/Domain/Entity
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Domain/Entity'
                prefix: 'App\Shared\Domain\Entity'
            Security:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Security/Domain/Entity'
                prefix: 'App\Security\Domain\Entity'
            Colloque:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Colloque/Domain/Entity'
                prefix: 'App\Colloque\Domain\Entity'
            Inscription:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inscription/Domain/Entity'
                prefix: 'App\Inscription\Domain\Entity'
            Travaux:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Travaux/Domain/Entity'
                prefix: 'App\Travaux\Domain\Entity'
            Attestation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Attestation/Domain/Entity'
                prefix: 'App\Attestation\Domain\Entity'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool
    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
