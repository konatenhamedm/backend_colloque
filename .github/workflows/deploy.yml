name: Deploy Backend

# Déploie sur https://backforum.instapoint.site à chaque push sur la branche `production`.
# Secrets du dépôt requis : APP_HOST, APP_USER, APP_PASS (même principe que Educ360).
on:
  push:
    branches: [production]

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # on n'interrompt jamais un déploiement en cours (migrations)

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSHPASS: ${{ secrets.APP_PASS }}
      TARGET_DIR: /var/www/backforum.instapoint.site/web
      # Binaire PHP du serveur (le projet est aligné sur PHP 8.2, comme Educ360 ; mettre php8.3 / php8.4 si le site change de version).
      PHP_BIN: php
      # Certificats SSL pas encore actifs : HTTP par défaut. Quand ils le sont : variable de dépôt USE_HTTPS=true.
      SCHEME: ${{ vars.USE_HTTPS == 'true' && 'https' || 'http' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SSHPASS
        run: sudo apt update && sudo apt install sshpass -y

      - name: Écrire .env.local depuis le secret ENV_LOCAL (si défini)
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -z "$ENV_LOCAL" ]; then
            echo "Secret ENV_LOCAL non défini : on conserve le .env.local déjà présent sur le serveur."
            exit 0
          fi
          printf '%s\n' "$ENV_LOCAL" | sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ConnectionAttempts=3 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "\
            mkdir -p $TARGET_DIR && cat > $TARGET_DIR/.env.local && chmod 600 $TARGET_DIR/.env.local"
          echo "✅ .env.local écrit sur le serveur (permissions 600)"

      - name: Vérifier la configuration de production (avant toute modification)
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ConnectionAttempts=3 -o ServerAliveInterval=15 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "\
            cd $TARGET_DIR || { echo '❌ Dossier $TARGET_DIR introuvable'; exit 1; }
            command -v $PHP_BIN >/dev/null && $PHP_BIN -r 'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);' || { echo '❌ $PHP_BIN (PHP >= 8.2) introuvable sur le serveur'; exit 1; }
            echo \"✅ PHP : \$($PHP_BIN -r 'echo PHP_VERSION;')\"
            for ext in pdo_pgsql intl gd mbstring zip ctype iconv; do
              pkg=\$ext; [ \"\$ext\" = pdo_pgsql ] && pkg=pgsql
              $PHP_BIN -m | grep -qix \"\$ext\" || { echo \"❌ Extension PHP manquante pour $PHP_BIN : \$ext  (apt install php8.2-\$pkg)\"; exit 1; }
            done
            [ -f .env.local ] || { echo '❌ .env.local absent : copiez .env.prod.example et renseignez les valeurs'; exit 1; }
            for k in APP_SECRET JWT_SECRET DATABASE_URL MAILER_DSN FRONT_URL CORS_ALLOW_ORIGIN; do
              grep -q \"^\$k=\" .env.local || { echo \"❌ \$k manquant dans .env.local\"; exit 1; }
            done
            if grep -Eq '^(JWT_SECRET|APP_SECRET)=.*(dev-|placeholder|change)' .env.local; then
              echo '❌ JWT_SECRET/APP_SECRET sont encore des valeurs de développement'; exit 1
            fi
            echo '✅ Configuration de production valide'
          "

      - name: Vérifier la connexion à la base de données (depuis le serveur)
        run: |
          set -o pipefail
          if ! sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ConnectionAttempts=3 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "cd $TARGET_DIR && $PHP_BIN" < .github/scripts/check-db.php > /tmp/dbcheck.txt 2>&1; then
            cat /tmp/dbcheck.txt
            msg=$(cat /tmp/dbcheck.txt | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Connexion à la base impossible::$msg"
            exit 1
          fi
          cat /tmp/dbcheck.txt

      - name: Backup Database Before Deploy
        run: |
          echo "🔒 Sauvegarde de la base de données avant déploiement..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ConnectionAttempts=3 -o ServerAliveInterval=15 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "\
            BACKUP_DIR=/var/www/backups/db/forum
            mkdir -p \"\$BACKUP_DIR\"
            TIMESTAMP=\$(date +%Y%m%d_%H%M%S)
            cd $TARGET_DIR && \
            DB_URL=\$(grep '^DATABASE_URL=' .env.local | tail -1 | cut -d= -f2- | tr -d '\"')
            DB_USER=\$(echo \"\$DB_URL\" | sed -n 's|.*://\([^:]*\):.*|\1|p')
            DB_PASS=\$(echo \"\$DB_URL\" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')
            DB_HOST=\$(echo \"\$DB_URL\" | sed -n 's|.*@\([^:]*\):.*|\1|p')
            DB_PORT=\$(echo \"\$DB_URL\" | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
            DB_NAME=\$(echo \"\$DB_URL\" | sed -n 's|.*/\([^?]*\).*|\1|p')
            BACKUP_FILE=\"\$BACKUP_DIR/\${DB_NAME}_pre_deploy_\${TIMESTAMP}.sql.gz\"
            echo \"Backup de \$DB_NAME vers \$BACKUP_FILE...\"
            if PGPASSWORD=\"\$DB_PASS\" pg_dump -h \"\$DB_HOST\" -p \"\$DB_PORT\" -U \"\$DB_USER\" -f \"\${BACKUP_FILE%.gz}\" \"\$DB_NAME\" && gzip -f \"\${BACKUP_FILE%.gz}\"; then
              echo \"✅ Backup réussi : \$BACKUP_FILE (\$(du -h \"\$BACKUP_FILE\" | cut -f1))\"
            else
              echo \"⚠️ Backup échoué, mais le déploiement continue...\"
            fi
            # Garder uniquement les 10 derniers backups
            ls -t \"\$BACKUP_DIR\"/*.sql.gz 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null
          " || echo "⚠️ Backup SSH échoué, déploiement continue quand même..."

      - name: Deploy and Update Symfony
        run: |
          set -o pipefail
          : > /tmp/deploy_out.txt
          SUCCESS=0
          for i in {1..3}; do
            echo "Tentative de déploiement Backend $i/3..."
            if sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ConnectionAttempts=5 -o ServerAliveInterval=15 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "\
              cd $TARGET_DIR && \
              ([ -d .git ] || (git init -q && git remote add origin https://github.com/${{ github.repository }}.git)) && \
              git config --global --add safe.directory '*' && \
              git fetch origin production && \
              git reset --hard origin/production && \
              export APP_ENV=prod && \
              COMPOSER_ALLOW_SUPERUSER=1 $PHP_BIN \$(command -v composer) install --no-dev --no-interaction --optimize-autoloader && \
              COMPOSER_ALLOW_SUPERUSER=1 $PHP_BIN \$(command -v composer) dump-env prod && \
              $PHP_BIN bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod && \
              $PHP_BIN bin/console app:seed-colloque --env=prod && \
              $PHP_BIN bin/console doctrine:schema:validate --skip-sync --env=prod && \
              $PHP_BIN bin/console cache:clear --env=prod && \
              $PHP_BIN bin/console cache:warmup --env=prod && \
              mkdir -p var/cache var/log var/data && \
              { OWN=\$(stat -c '%U:%G' $TARGET_DIR); [ \"\${OWN%%:*}\" = root ] && OWN=www-data:www-data; true; } && \
              chown -R \"\$OWN\" $TARGET_DIR && \
              chmod -R 775 var \
            " 2>&1 | tee -a /tmp/deploy_out.txt; then
              SUCCESS=1
              echo "Déploiement Backend réussi !"
              break
            else
              echo "Tentative SSH $i échouée, nouvelle tentative dans 10s..."
              sleep 10
            fi
          done
          if [ $SUCCESS -ne 1 ]; then
            # Les dernières lignes d'erreur sont publiées en annotation (lisible sans ouvrir les journaux).
            msg=$(tail -n 25 /tmp/deploy_out.txt | grep -v '^{"message"' | tr -d '\r' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Détail de l'échec du déploiement::$msg"
            echo "ERREUR : Échec du déploiement SSH Backend après 3 tentatives !"
            exit 1
          fi

      - name: Vérification après déploiement
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' ${SCHEME}://backforum.instapoint.site/api/public/colloque || true)
            echo "GET /api/public/colloque -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "❌ L'API ne répond pas correctement après déploiement"; exit 1
